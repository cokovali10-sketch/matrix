[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-ai"
version = "0.1.0"
description = "MATRIX - artificial work environment for AI capability growth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cokovali10-sketch" }]
keywords = ["ai", "matrix", "learning", "evaluation", "tools", "tasks", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/cokovali10-sketch/matrix"
Repository = "https://github.com/cokovali10-sketch/matrix"

[project.scripts]
matrix = "matrix.cli:main"

[tool.setuptools.packages.find]
include = ["matrix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
